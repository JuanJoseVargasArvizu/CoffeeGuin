<h1>Inventario</h1>

<section class="panel">
	<div style="display:flex;justify-content:space-between;align-items:center">
		<h2>Categorías</h2>
		<button class="action-btn" (click)="openCategoriaModal(true)">Agregar categoría</button>
	</div>

	<div class="grid">
		<button *ngFor="let c of categorias" class="category-btn item-card">
			<div class="item-top">
				<div class="item-name">{{ c.nombre }}</div>
			</div>
			<div class="item-meta">
				<button type="button" class="small edit-btn" (click)="startEditCategoria(c)">Editar</button>
				<button type="button" class="small danger-btn" (click)="delCategoria(c)">Eliminar</button>
			</div>
		</button>
	</div>
</section>

<section class="panel">
	<div style="display:flex;justify-content:space-between;align-items:center">
		<h2>Productos</h2>
		<button class="action-btn" (click)="openProductoModal(true)">Agregar producto</button>
	</div>

	<div class="grid">
		<div *ngFor="let p of productos" class="item-card" [ngClass]="p.tipo">
			<div class="product-top">
				<div>
					<div class="item-name">{{ p.nombre }}</div>
					<div class="item-meta">Tipo: {{ p.tipo }} · {{ p.categoria?.nombre || p.categoria }}</div>
				</div>
				<div class="product-price">{{ p.precio ? ('$' + p.precio) : '' }}</div>
			</div>

			<div style="margin-top:8px;display:flex;justify-content:flex-end;gap:8px">
					<button type="button" class="small edit-btn" (click)="startEditProducto(p)">Editar</button>
					<button type="button" class="small danger-btn" (click)="delProducto(p)">Eliminar</button>
			</div>
		</div>
	</div>
</section>

<!-- Categoria Modal -->
<div class="modal-overlay" *ngIf="showCategoriaModal" (click)="closeCategoriaModal()">
	<div class="modal" (click)="$event.stopPropagation()">
		<div class="modal-header"><h3>{{ categoriaForm.id ? 'Editar categoría' : 'Agregar categoría' }}</h3></div>
		<form (ngSubmit)="saveCategoria()">
			<input class="search" [(ngModel)]="categoriaForm.nombre" name="nombre" placeholder="Nombre" required />
			<div class="modal-actions">
				<button type="submit" class="action-btn">Guardar</button>
				<button type="button" class="small" (click)="closeCategoriaModal()">Cancelar</button>
			</div>
		</form>
	</div>
</div>

<!-- Producto Modal -->
<div class="modal-overlay" *ngIf="showProductoModal" (click)="closeProductoModal()">
	<div class="modal" (click)="$event.stopPropagation()">
		<div class="modal-header"><h3>{{ productoForm.id ? 'Editar producto' : 'Agregar producto' }}</h3></div>
		<form (ngSubmit)="saveProducto()">
			<div *ngIf="!productoForm.tipo" class="field">
				<label>Tipo de producto</label>
				<div class="type-selector">
					<button aria-label="Bebida" type="button" class="type-btn bebida" [class.selected]="productoForm.tipo==='bebida'" (click)="setProductoTipo('bebida')">Bebida</button>
					<button aria-label="Alimento" type="button" class="type-btn alimento" [class.selected]="productoForm.tipo==='alimento'" (click)="setProductoTipo('alimento')">Alimento</button>
					<button aria-label="Ingrediente" type="button" class="type-btn ingrediente" [class.selected]="productoForm.tipo==='ingrediente'" (click)="setProductoTipo('ingrediente')">Ingrediente</button>
				</div>
			</div>

			<div *ngIf="productoForm.tipo === 'bebida' || productoForm.tipo === 'alimento'">
				<div class="field">
					<label>Nombre</label>
					<input class="search" [(ngModel)]="productoForm.nombre" name="nombre" placeholder="Nombre" required />
				</div>

				<div class="field">
					<label>Precio</label>
					<input class="search" type="number" [(ngModel)]="productoForm.precio" name="precio" placeholder="Precio" />
				</div>

				<div class="field">
					<label>Categoría</label>
					<select class="search" [(ngModel)]="productoForm.categoriaId" name="categoriaId">
						<option [ngValue]="null">Sin categoría</option>
						<option *ngFor="let c of categorias" [ngValue]="c.id">{{ c.nombre }}</option>
					</select>
				</div>

				<div class="field">
					<label>Ingredientes</label>
					<div class="ingredients-list" style="max-height:200px;overflow:auto;border:1px solid #eee;padding:8px;border-radius:6px">
						<label *ngFor="let ing of ingredientes" style="display:flex;align-items:center;gap:8px;padding:4px 0">
							<input type="checkbox" [checked]="isIngredienteSelected(ing.id)" (change)="toggleIngrediente(ing.id, $event.target.checked)" />
							<span>{{ ing.nombre || ('ID ' + ing.id) }}</span>
						</label>
					</div>
				</div>
			</div>

			<div *ngIf="productoForm.tipo === 'ingrediente'">
				<div class="field">
					<label>Nombre</label>
					<input class="search" [(ngModel)]="productoForm.nombre" name="nombre" placeholder="Nombre" required />
				</div>

				<div class="field">
					<label>Stock</label>
					<input class="search" type="number" [(ngModel)]="productoForm.stockActual" name="stockActual" placeholder="Stock" />
				</div>

				<div class="field">
					<label>Categoría (opcional)</label>
					<select class="search" [(ngModel)]="productoForm.categoriaId" name="categoriaId">
						<option [ngValue]="null">Sin categoría</option>
						<option *ngFor="let c of categorias" [ngValue]="c.id">{{ c.nombre }}</option>
					</select>
				</div>
			</div>

			<div class="modal-actions">
				<button type="submit" class="action-btn" [disabled]="!productoForm.tipo">Guardar</button>
				<button type="button" class="small" (click)="closeProductoModal()">Cancelar</button>
				<button *ngIf="productoForm.tipo" type="button" class="small" (click)="productoForm.tipo = null">Cambiar tipo</button>
			</div>
		</form>
	</div>
</div>
